name: ClipBubble
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    from: 0.14.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.6.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BHAM5T9649
    CODE_SIGN_STYLE: Automatic
# The sync engine, store and SSH go into every target: the app, the share extension and the keyboard each link on their own.
targetTemplates:
  Synced:
    sources:
      - Shared
      - ../Sources/Sync.swift
      - ../Sources/Store.swift
      - ../Sources/Link.swift
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - sdk: libsqlite3.tbd
    entitlements:
      path: ${target_name}.entitlements
      properties:
        com.apple.security.application-groups: [group.studio.krnl.clipbubble]
targets:
  ClipBubble:
    type: application
    platform: iOS
    templates: [Synced]
    sources: [Sources]
    dependencies:
      - target: ClipBubbleShare
      - target: ClipBubbleKeyboard
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # SSH runs on CryptoKit (swift-crypto ships no BoringSSL on iOS), so all encryption is the OS's own.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ClipBubble connects to your computers on this network to sync your clipboard.
        NSCameraUsageDescription: To scan the code your Mac shows when you link this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: studio.krnl.clipbubble
            CFBundleURLSchemes: [clipbubble]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble
  ClipBubbleShare:
    type: app-extension
    platform: iOS
    templates: [Synced]
    sources: [Share]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble.share
  ClipBubbleKeyboard:
    type: app-extension
    platform: iOS
    templates: [Synced]
    sources: [Keyboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble.keyboard
