name: Windows

on:
  push:
    paths: ['Windows/**', 'Tests/fixtures/sync/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Tests/fixtures/sync/**', '.github/workflows/windows.yml']
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default. Only the release job below can write, and only when a release is published.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: dotnet build Windows/Tests/ClipBubble.Tests.csproj -c Release -nologo
      - run: Windows/Tests/bin/Release/net48/ClipBubble.Tests.exe
      # Sync codec, store and pipe relay on .NET 10 (the same suite runs against the Mac engine in tests.sh).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Windows/SyncTests -c Release
      - run: Compress-Archive Windows/bin/Release/net48/ClipBubble.exe ClipBubble-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ClipBubble-Windows
          path: ClipBubble-Windows.zip

  # Publishing a release (from the Mac, as usual) attaches the Windows build to it.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ClipBubble-Windows
      - run: gh release upload "$TAG" ClipBubble-Windows.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
